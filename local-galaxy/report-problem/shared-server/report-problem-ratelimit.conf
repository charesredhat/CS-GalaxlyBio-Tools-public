# Rate limit for the "Report a problem" webhook on a PUBLIC Galaxy.
#
# Install to: /etc/nginx/conf.d/report-problem-ratelimit.conf   (http context)
# Then add the `location` block from the bottom of this file into the Galaxy
# server block, and reload:  nginx -t && systemctl reload nginx
#
# Why this is needed
# ------------------
# /api/webhooks/report_problem/data is an unauthenticated GET that appends up to
# ~5.7 KB to <galaxy>/database/problem_reports/reports.jsonl on every call. On a
# localhost-only install that is fine. On a public instance it is an open write
# endpoint: a single loop, or a crawler that follows the URL, can grow that file
# without bound on the same volume Galaxy keeps datasets and jobs on. The
# upstream README says to put it behind auth or rate limiting before exposing
# it; this is the rate-limiting half.
#
# THE ALB CAVEAT -- read before trusting this
# -------------------------------------------
# This Galaxy sits behind an AWS ALB, so nginx sees the ALB's address as the
# peer, not the user's. Keyed on $binary_remote_addr as-is, every request on
# earth shares one or two buckets: one busy user would throttle everybody, and
# an abuser would be indistinguishable from normal traffic.
#
# `set_real_ip_from` + `real_ip_header` fix that by trusting the ALB's
# X-Forwarded-For, after which $binary_remote_addr IS the client address.
# Two things to confirm on the host rather than assume:
#
# Both must be confirmed on the host before this file is used:
#
#   1. Fill in the trust list below with your load balancer's ACTUAL per-AZ
#      subnets, not a guessed /16. Confirm the name you resolve to is really
#      your LB (`dig +short <your-galaxy-host>` against the LB's own DNS), then
#      derive the CIDRs:
#        LB=<your-load-balancer-name>
#        SUBNETS=$(aws elbv2 describe-load-balancers --names "$LB" \
#          --query 'LoadBalancers[0].AvailabilityZones[].SubnetId' --output text)
#        aws ec2 describe-subnets --subnet-ids $SUBNETS \
#          --query 'Subnets[].CidrBlock' --output text
#      Listing only those /24s rather than the whole VPC means a host elsewhere
#      in the VPC cannot spoof X-Forwarded-For past the limit. If the ALB gains
#      a subnet, add it here or that AZ's traffic all shares one bucket.
#
#      Leaving the placeholders below unedited will stop nginx from loading this
#      file -- that is deliberate, so an unconfigured copy fails loudly.
#
#   2. nginx 1.24.0 (Ubuntu) here reports with-http_realip_module, so these
#      directives load. Re-check after an nginx upgrade with
#      `nginx -V 2>&1 | grep -o with-http_realip_module`; without it nginx
#      refuses to start, which `nginx -t` catches before a reload.
#
# If realip is ever unavailable, do NOT silently fall back to keying on
# $http_x_forwarded_for: that header is client-supplied on a direct connection
# and trivially varied, so the limit becomes decorative. Restrict the endpoint
# to internal ranges instead.

# REPLACE these with your LB's real per-AZ subnets (see note 1 above).
set_real_ip_from SUBNET_AZ_1/24;
set_real_ip_from SUBNET_AZ_2/24;
set_real_ip_from SUBNET_AZ_3/24;
real_ip_header   X-Forwarded-For;
real_ip_recursive on;

# 5 requests/minute/client, 10 MB of state (~160k distinct addresses).
# A human filing a report makes exactly one. 429 is the honest status; nginx
# defaults limit_req to 503, which reads as "Galaxy is broken".
limit_req_zone $binary_remote_addr zone=report_problem:10m rate=5r/m;
limit_req_status 429;

# ---------------------------------------------------------------------------
# Add this to the Galaxy server block (NOT to this file -- it is http context).
#
# An exact-match `location =` outranks the prefix `location /`, so this captures
# that one URL and nothing else. Copy the proxy_* directives from the existing
# `location /` so the request reaches Galaxy identically -- if that block sets
# proxy_set_header Host / X-Forwarded-For / X-Forwarded-Proto, this one must too,
# or Galaxy will build wrong absolute URLs for exactly this request.
#
#     location = /api/webhooks/report_problem/data {
#         limit_req zone=report_problem burst=3 nodelay;
#         proxy_pass http://unix:/server/galaxy/var/gunicorn.sock;
#         # <-- mirror proxy_set_header lines from `location /` here
#     }
# ---------------------------------------------------------------------------
