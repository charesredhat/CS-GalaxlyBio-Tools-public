# Subjects the mock OpenID Provider will vouch for, loaded at startup via
# --user-claims-file. All 10 sandbox test accounts.
#
# IMPORTANT: this file predefines CLAIMS; it does not restrict who may log in.
# The mock provider authenticates any subject you hand it, and an unregistered
# subject arrives with no email claim -- whereupon Galaxy (allow_user_creation:
# true) auto-provisions a new account using the subject string as the email.
# That is why the provider must stay bound to 127.0.0.1, and why you should not
# type an arbitrary subject into its form.
#
# Subjects are deliberately opaque rather than emails: that is what a real IdP
# sends, and it keeps the setup honest about uid being `sub`, never email.
- sub: "mock-sub-00000001-testuser01"
  email: "testuser01@example.org"
  email_verified: true
  name: "Test User 01"
  preferred_username: "testuser01"
